name: Manual Build+Package+Release (AkiDesk Win+Linux)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (example: v1.0.0)"
        required: true
      qt_version:
        description: "Qt version"
        required: false
        default: "6.6.3"
      release_title:
        description: "Release title (leave empty to use default)"
        required: false
        default: ""
      build_type:
        description: "CMake build type"
        required: false
        default: "Release"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      #========================
      # Linux依赖
      #========================
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build wget patchelf desktop-file-utils \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-randr0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0

      #========================
      # Windows工具链
      #========================
      - name: Setup Ninja (Windows)
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      #========================
      # Qt(补齐Multimedia，避免Qt6_FOUND=FALSE)
      #========================
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ inputs.qt_version }}
          target: desktop
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || 'gcc_64' }}
          modules: qtmultimedia
          cache: true

      #========================
      # 构建
      #========================
      - name: Configure (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build
        run: cmake --build build

      #========================================================
      # Windows：windeployqt + Inno Setup
      # 注意：AkiDesk的默认配置通过Qt资源系统(qrc)嵌入，
      # 首次运行时main.cpp会自动部署到用户文档目录，
      # 因此这里不需要像ZcChat2那样额外复制默认配置文件。
      # 同时AkiDesk没有3rdparty外部DLL依赖，也无需复制第三方DLL。
      #========================================================
      - name: Package Windows (windeployqt)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if(!(Test-Path "build\AkiDesk.exe")){ throw "Not found: build\AkiDesk.exe" }

          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build\AkiDesk.exe dist\

          $qtBin = Join-Path "${{ env.Qt6_DIR }}" "bin"
          $windeploy = Join-Path $qtBin "windeployqt.exe"
          if(!(Test-Path $windeploy)){ throw "windeployqt not found: $windeploy" }

          & $windeploy --release --compiler-runtime dist\AkiDesk.exe

      - name: Check dist files (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if(!(Test-Path "dist\AkiDesk.exe")){ throw "dist\AkiDesk.exe missing" }

          #关键Qt库
          if(!(Test-Path "dist\Qt6Core.dll")){ throw "dist\Qt6Core.dll missing" }

          #关键平台插件(没有这个基本一定打不开)
          if(!(Test-Path "dist\platforms\qwindows.dll")){ throw "dist\platforms\qwindows.dll missing (windeployqt failed?)" }

          $dlls=Get-ChildItem "dist" -File -Filter *.dll -ErrorAction SilentlyContinue
          if($dlls.Count -eq 0){ throw "No *.dll found in dist" }

          "dist root dll count: $($dlls.Count)"

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y
          $iscc="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if(!(Test-Path $iscc)){ throw "ISCC not found: $iscc" }

      - name: Build Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if(!(Test-Path "installer\AkiDesk.iss")){ throw "Not found: installer\AkiDesk.iss" }

          $ver="${{ inputs.tag_name }}".TrimStart("v")
          & $iscc /DMyAppVersion=$ver "installer\AkiDesk.iss"

          if(!(Test-Path "installer\output\AkiDesk_Setup.exe")){ throw "Installer output not found" }
          Move-Item "installer\output\AkiDesk_Setup.exe" "AkiDesk-${{ inputs.tag_name }}-setup.exe" -Force

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: AkiDesk-${{ inputs.tag_name }}-setup.exe

      #========================================================
      # Linux：AppImage
      #========================================================
      - name: Package Linux (AppImage via linuxdeployqt)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "build/AkiDesk" ]; then
            echo "Not found: build/AkiDesk"
            exit 1
          fi

          rm -rf AppDir linuxdeployqt.AppImage squashfs-root dist || true
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps dist

          cp build/AkiDesk AppDir/usr/bin/AkiDesk
          chmod +x AppDir/usr/bin/AkiDesk

          cat > AppDir/usr/share/applications/AkiDesk.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AkiDesk
          Exec=AkiDesk
          Icon=AkiDesk
          Categories=Utility;
          Terminal=false
          EOF

          # 注意：使用项目logo作为AppImage图标
          # 如果assets/logo.png存在则使用，否则使用占位图标
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/AkiDesk.png
          else
            base64 -d > AppDir/usr/share/icons/hicolor/256x256/apps/AkiDesk.png <<'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+X2m0AAAAASUVORK5CYII=
          EOF
          fi

          wget -qO linuxdeployqt.AppImage https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt.AppImage
          ./linuxdeployqt.AppImage --appimage-extract

          ./squashfs-root/AppRun AppDir/usr/share/applications/AkiDesk.desktop -appimage

          OUT_APPIMAGE="$(ls -1 AkiDesk-*.AppImage | head -n 1)"
          mv "$OUT_APPIMAGE" "dist/AkiDesk-${{ inputs.tag_name }}-linux-x86_64.AppImage"

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: pkg-linux
          path: dist/AkiDesk-${{ inputs.tag_name }}-linux-x86_64.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title != '' && inputs.release_title || format('AkiDesk {0}', inputs.tag_name) }}
          generate_release_notes: true
          files: release_assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
